      const items = [{ head: 'hwc' }].concat(k.apps().map(a => ({ label: a.name, icon: a.icon, act: () => k.run(a.id) })));
      if (htui.wins.length) {
        items.push({ sep: true }, { head: 'ウィンドウ' });
        htui.wins.forEach(w => items.push({ label: w.title, icon: (OS.apps[w.app] || {}).icon || 'file', hint: w.el.classList.contains('hidden') ? '最小化' : null, act: () => w.focus() }));
      }
      items.push({ sep: true }, { label: '画面モード: ' + OS.modeNames[OS.modePref], icon: OS.modeIcons[OS.uiMode], act: () => setTimeout(() => htui.menuAt(x, y, k.modeItems()), 0) });
      htui.menuAt(x, y, items.concat([{ sep: true }], k.powerItems()));
    },
    onKey(e) {
      // Alt+Tab（ブラウザや OS が先に取ってしまう環境では Alt+` でも切り替えられる）
      if (e.altKey && !e.ctrlKey && (e.key === 'Tab' || e.key === '`')) {
        const list = htui.wins.slice().sort((a, b) => (+a.el.style.zIndex || 0) - (+b.el.style.zIndex || 0));
        if (!list.length) return true;
        const w = e.shiftKey ? list[list.length - 2] || list[0] : list[0];
        w.focus(); this.osd(w.title);
        return true;
      }
      if (e.ctrlKey && e.altKey && e.key === 'Enter') { htui.kit.run('terminal'); return true; }
    },
    osd(text) {
      let o = htui.el.querySelector('.wm-osd');
      if (!o) { o = h('div', { class: 'wm-osd', role: 'status' }); htui.el.append(o); }
      o.textContent = text; clearTimeout(this._osd);
      this._osd = setTimeout(() => o.remove(), 900);
    }
  });
})();
</script>
<script type="text/x-htmlos" data-path="/sys/style.css">
/* htmlOS システムスタイル (/sys/style.css)
   レイアウト: 画面全体が tty1、その上に HTUi（上パネル + デスクトップ + ウィンドウ）が重なる */
:root{
  --accent:#3584e4;
  --ink:#24262b; --ink-2:#5b5f69;
  --surface:#fafafb; --surface-2:#eeeef1; --line:#cfd0d6;
  --panel:#1b1d22; --panel-ink:#e9eaee;
  --tty-bg:#121418; --tty-ink:#d6d8dc;
  --danger:#c01c28;
  --ui:system-ui,-apple-system,"Segoe UI","Noto Sans JP","Noto Sans CJK JP","Hiragino Sans","Yu Gothic UI",sans-serif;
  --mono:ui-monospace,"DejaVu Sans Mono","Noto Sans Mono CJK JP",Menlo,Consolas,monospace;
}
#os-root{position:fixed;inset:0;overscroll-behavior:none;font:14px/1.5 var(--ui);color:var(--ink);background:var(--tty-bg)}
#os-root *{box-sizing:border-box}
#os-root button{font:inherit;color:inherit}
#os-root :focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.ico{display:inline-flex;flex:none;vertical-align:middle}

/* ---- tty */
#tty1{position:absolute;inset:0;display:flex}
.tty{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--tty-bg);color:var(--tty-ink);font:13.5px/1.45 var(--mono)}
.tty-scr{flex:1;min-height:0;overflow:auto;padding:8px 10px;cursor:text}
.tty-line{margin:0}
.tty-keys{display:none;flex:none;gap:5px;padding:6px;overflow-x:auto;background:#1d2026;border-top:1px solid #2c3038;scrollbar-width:none}
.tty-key{flex:none;min-width:40px;height:38px;padding:0 10px;border:1px solid #3a3f4a;border-radius:7px;background:#2a2e36;color:#e9eaee!important;font:14px var(--mono);cursor:pointer}
.tty-key:active{background:#3d4350}
.tty-out{white-space:pre-wrap;word-break:break-all}
.tty-line{display:flex;align-items:baseline}
.tty-prompt{white-space:pre;color:#8ec07c;flex:none}
.tty-input{flex:1;min-width:0;background:none;border:0;outline:0!important;color:inherit;font:inherit;padding:0;margin:0;caret-color:#fff}
.t-prompt{color:#8ec07c}.t-err{color:#ff7b72}.t-ok{color:#7ee787}.t-dim{color:#8b93a1}.t-accent{color:#79b8ff}.t-dir{color:#79b8ff;font-weight:600}
.poweroff{position:absolute;inset:0;background:#000;color:#9aa0a6;display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center;font-family:var(--mono);animation:fade-in .8s ease-out}
.poweroff p{margin:6px 0 0;color:#c9ccd3}
.poweroff small{font-size:12px}
.pw-btn{width:84px;height:84px;border-radius:50%;border:2px solid #3a3f4a;background:#15171b;color:#8b93a1!important;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:color .2s,border-color .2s,box-shadow .2s}
.pw-btn:hover,.pw-btn:focus-visible{color:#7ee787!important;border-color:#7ee787;box-shadow:0 0 22px rgba(126,231,135,.35)}
#splash.down{animation:fade-in .28s ease-out}

/* ---- 共通部品 */
.btn{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border:1px solid var(--line);border-radius:6px;background:#fff;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.small{padding:2px 8px;font-size:12.5px}
.btn.primary{background:var(--accent);border-color:transparent;color:#fff!important}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{background:var(--danger);border-color:transparent;color:#fff!important}
.btn.ghost{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.25);color:#fff!important}
.btn.ghost:hover{background:rgba(255,255,255,.22)}
.btn:disabled{opacity:.45;cursor:default}
.inp{font:inherit;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:6px;padding:5px 8px;min-width:0;width:100%}
.tbtn{display:inline-flex;align-items:center;gap:5px;padding:4px 8px;border:1px solid transparent;border-radius:6px;background:none;cursor:pointer;white-space:nowrap}
.tbtn:hover{background:rgba(0,0,0,.07)}
.tbtn.on{background:var(--accent);color:#fff!important}
.tbtn:disabled{opacity:.4;cursor:default}
.avatar{display:inline-flex;flex:none;align-items:center;justify-content:center;border-radius:50%;color:#fff;font-weight:600;background-size:cover;background-position:center;line-height:1}

/* ---- HTUi */
#htui{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden}

.panel{flex:none;height:32px;display:flex;align-items:center;gap:4px;padding:0 6px;background:var(--panel);color:var(--panel-ink);font-size:13px;z-index:5}
.p-btn{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 9px;border:0;border-radius:6px;background:none;cursor:pointer;flex:none}
.p-btn:hover{background:rgba(255,255,255,.14)}
.p-tasks{flex:1;min-width:0;display:flex;gap:3px;overflow-x:auto;scrollbar-width:none}
.p-task{display:inline-flex;align-items:center;gap:5px;height:26px;max-width:160px;padding:0 8px;border:0;border-radius:6px;background:rgba(255,255,255,.07);cursor:pointer;flex:0 1 auto;min-width:34px}
.p-task span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.p-task.active{background:rgba(255,255,255,.24)}
.p-clock{flex:none;padding:0 8px;font-variant-numeric:tabular-nums}
.p-uname{max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.desk{flex:1;position:relative;min-height:0;overflow:hidden}
.desk-icons{position:absolute;inset:12px auto 12px 12px;display:flex;flex-direction:column;flex-wrap:wrap;gap:6px;align-content:flex-start}
.desk-icon{display:flex;flex-direction:column;align-items:center;gap:4px;width:76px;padding:6px 2px;border:0;border-radius:8px;background:none;color:#fff!important;cursor:pointer;font-size:12.5px;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.desk-icon:hover{background:rgba(255,255,255,.16)}
.app-ico{display:flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:11px;color:#fff;box-shadow:0 1px 3px rgba(0,0,0,.35)}

.menu{position:absolute;z-index:100000;min-width:200px;max-width:calc(100% - 8px);background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.3);padding:4px;display:flex;flex-direction:column}
.menu-item{display:flex;align-items:center;gap:8px;padding:6px 10px;border:0;border-radius:5px;background:none;text-align:left;cursor:pointer}
.menu-item:hover{background:var(--accent);color:#fff!important}
.menu-hint{margin-left:auto;padding-left:14px;font-size:12px;opacity:.7}
.menu{max-height:calc(100% - 8px);overflow:auto}
.menu-sep{flex:none;height:1px;background:var(--line);margin:4px 6px}
.menu-head{flex:none;padding:5px 10px 2px;font-size:12px;font-weight:600;color:var(--ink-2)}
.menu-item:disabled{opacity:.45}

/* ---- ウィンドウ */
.win{position:absolute;display:flex;flex-direction:column;min-width:200px;min-height:120px;background:var(--surface);border:1px solid #8d8f98;border-radius:9px;box-shadow:0 6px 20px rgba(0,0,0,.3);overflow:hidden;transition:box-shadow .15s,border-radius .15s}
.win.active{box-shadow:0 12px 36px rgba(0,0,0,.5);border-color:#5f6169}
.win.hidden{display:none}
.win.tiled{border-radius:0}
.win.max{border-color:transparent}
.win.geo{transition:left .2s cubic-bezier(.2,.8,.2,1),top .2s cubic-bezier(.2,.8,.2,1),width .2s cubic-bezier(.2,.8,.2,1),height .2s cubic-bezier(.2,.8,.2,1),border-radius .15s}
.rz{position:absolute;z-index:3;touch-action:none}
.rz-n,.rz-s{left:10px;right:10px;height:5px;cursor:ns-resize}.rz-n{top:0}.rz-s{bottom:0}
.rz-e,.rz-w{top:10px;bottom:10px;width:5px;cursor:ew-resize}.rz-e{right:0}.rz-w{left:0}
.rz-ne,.rz-nw,.rz-se,.rz-sw{width:12px;height:12px}
.rz-ne{top:0;right:0;cursor:nesw-resize}.rz-nw{top:0;left:0;cursor:nwse-resize}.rz-se{bottom:0;right:0;cursor:nwse-resize}.rz-sw{bottom:0;left:0;cursor:nesw-resize}
.win.max .rz{display:none}
.snap-preview{position:absolute;box-sizing:border-box;border:2px solid var(--accent);background:color-mix(in srgb,var(--accent) 22%,transparent);border-radius:10px;opacity:0;transform:scale(.96);pointer-events:none;transition:opacity .12s,transform .12s,left .12s,top .12s,width .12s,height .12s}
.snap-preview.on{opacity:1;transform:scale(.985)}
.win-head{flex:none;display:flex;align-items:center;gap:7px;height:34px;padding:0 6px 0 10px;background:var(--surface-2);border-bottom:1px solid var(--line);cursor:default;user-select:none;touch-action:none;color:var(--ink-2)}
.win.active .win-head{color:var(--ink)}
.win-title{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;font-size:13px}
.win-btns{display:flex;gap:3px;flex:none}
.win-btn{display:flex;align-items:center;justify-content:center;width:24px;height:24px;border:0;border-radius:50%;background:rgba(0,0,0,.07);cursor:pointer}
.win-btn:hover{background:rgba(0,0,0,.16)}
.win-btn.close:hover{background:var(--danger);color:#fff!important}
.win-body{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden;position:relative}
#htui.dragging iframe{pointer-events:none}
.win:not(.active) iframe{pointer-events:none}
.toolbar{flex:none;display:flex;align-items:center;gap:3px;flex-wrap:wrap;padding:4px 6px;background:var(--surface-2);border-bottom:1px solid var(--line)}
.toolbar .sep{width:1px;align-self:stretch;background:var(--line);margin:2px 4px}
.toolbar .grow{flex:1;min-width:120px}
.statusbar{flex:none;display:flex;align-items:center;gap:12px;padding:2px 10px;font-size:12px;color:var(--ink-2);background:var(--surface-2);border-top:1px solid var(--line);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden}
.statusbar .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}

/* ---- ダイアログ */
.modal-ov{position:absolute;inset:0;z-index:200000;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;padding:16px;color:var(--ink)}
.modal{width:380px;max-width:100%;max-height:100%;display:flex;flex-direction:column;background:var(--surface);border-radius:11px;box-shadow:0 16px 48px rgba(0,0,0,.5);overflow:hidden}
.modal-title{padding:11px 16px 0;font-weight:700}
.modal-body{padding:10px 16px;display:flex;flex-direction:column;gap:8px;overflow:auto;min-height:0}
.modal-msg{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;padding:10px 16px 14px}
.toast{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);z-index:300000;max-width:calc(100% - 32px);background:#1b1d22;color:#fff;padding:8px 14px;border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,.4);font-size:13px}
.fp-places{display:flex;flex-wrap:wrap;gap:4px}
.fp-path{font:12.5px var(--mono);color:var(--ink-2);overflow-wrap:anywhere}
.fp-list{height:210px;overflow:auto;border:1px solid var(--line);border-radius:6px;background:#fff;display:flex;flex-direction:column}
.fp-item{display:flex;align-items:center;gap:7px;padding:4px 9px;border:0;background:none;text-align:left;cursor:pointer;flex:none}
.fp-item:hover{background:var(--surface-2)}
.fp-item.sel{background:var(--accent);color:#fff!important}
.fp-err{min-height:1.4em;color:var(--danger);font-size:12.5px}

/* ---- Terminal */
.win-body>.tty{border-radius:0}

/* ---- hedit */
.he-wrap{flex:1;min-height:0;display:flex;background:#fff}
.he-gutter{flex:none;min-width:44px;padding:8px 8px 8px 6px;text-align:right;white-space:pre;overflow:hidden;background:#f3f3f5;color:#9a9ca5;border-right:1px solid var(--line);font:13.5px/1.5 var(--mono);user-select:none}
.he-text{flex:1;min-width:0;border:0;outline:0!important;resize:none;padding:8px 10px;font:13.5px/1.5 var(--mono);color:var(--ink);background:#fff;white-space:pre;overflow:auto;tab-size:2}
.he-text.wrap{white-space:pre-wrap;overflow-wrap:anywhere}
.he-find{flex:none;display:flex;gap:6px;align-items:center;padding:4px 8px;background:var(--surface-2);border-bottom:1px solid var(--line)}
.he-find .inp{max-width:260px}

/* ---- hFile */
.hf-main{flex:1;min-height:0;display:flex}
.hf-side{flex:none;width:136px;padding:6px;background:var(--surface-2);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:2px;overflow:auto}
.hf-place{display:flex;align-items:center;gap:7px;padding:4px 8px;border:0;border-radius:6px;background:none;text-align:left;cursor:pointer;font-size:13px}
.hf-place:hover{background:rgba(0,0,0,.07)}
.hf-place.on{background:var(--accent);color:#fff!important}
.hf-grid{flex:1;min-width:0;overflow:auto;padding:10px;display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px;align-content:start;background:#fff}
.hf-item{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px;border:1px solid transparent;border-radius:8px;background:none;cursor:pointer;font-size:12.5px;min-width:0}
.hf-item:hover{background:var(--surface-2)}
.hf-item.sel{background:color-mix(in srgb,var(--accent) 18%,#fff);border-color:var(--accent)}
.hf-item .ico{color:var(--ink-2)}
.hf-item.dir .ico{color:var(--accent)}
.hf-name{max-width:100%;overflow-wrap:anywhere;text-align:center;line-height:1.3}
.hf-empty{grid-column:1/-1;color:var(--ink-2);padding:20px;text-align:center}
.hf-meter{flex:none;width:90px;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.hf-meter i{display:block;height:100%;background:var(--accent)}
@media (max-width:520px){.hf-side{width:44px}.hf-place span:last-child{display:none}}

/* ---- hPlayer */
.hp-stage{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#17181c;color:#c9ccd3;overflow:hidden;padding:10px}
.hp-stage img,.hp-stage video{max-width:100%;max-height:100%;min-height:0;object-fit:contain}
.hp-stage audio{width:min(420px,100%)}
.hp-stage .hp-note{text-align:center;max-width:36em}
.hp-disc{width:120px;height:120px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,#2c2e35 0 22%,#0e0f12 23% 100%);color:var(--accent);border:1px solid #33363e}

/* ---- hBrowser */
.hb-url{font:13px var(--mono)}
.hb-view{flex:1;min-height:0;position:relative;background:#fff;display:flex}
.hb-view iframe{flex:1;border:0;width:100%;height:100%;background:#fff}
.hb-page{flex:1;overflow:auto;padding:24px 20px;display:flex;flex-direction:column;align-items:center;gap:14px}
.hb-page h1{margin:0;font:600 26px var(--mono)}
.hb-page p{margin:0;max-width:38em;color:var(--ink-2)}
.hb-marks{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:620px}
.hb-mark{display:inline-flex;align-items:center;gap:6px}
.hb-mark .btn{border-radius:6px 0 0 6px}
.hb-mark .del{border:1px solid var(--line);border-left:0;border-radius:0 6px 6px 0;background:#fff;padding:5px 6px;cursor:pointer;display:flex;align-items:center;margin-left:-6px}
.hb-search{display:flex;gap:6px;width:min(480px,100%)}
.hb-pre{flex:1;margin:0;padding:12px;overflow:auto;font:13px/1.5 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere}

/* ---- Settings */
.st-main{flex:1;min-height:0;display:flex}
.st-nav{flex:none;width:140px;padding:6px;background:var(--surface-2);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:2px;overflow:auto}
.st-page{flex:1;min-width:0;overflow:auto;padding:16px 18px;display:flex;flex-direction:column;gap:14px}
.st-page>*,.hb-page>*,.modal-body>*{flex:none}
.st-page h2{margin:0;font-size:17px}
.st-page h3{margin:6px 0 0;font-size:14px}
.st-page p{margin:0;color:var(--ink-2);max-width:44em}
.st-card{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:#fff}
.st-card .who{flex:1;min-width:110px}
.st-card .who b{display:block}
.st-card .who small{color:var(--ink-2)}
.st-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.st-row label{display:inline-flex;align-items:center;gap:6px}
.st-swatches{display:flex;gap:8px;flex-wrap:wrap}
.st-sw{width:34px;height:34px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0}
.st-sw.wp{width:74px;height:46px;border-radius:7px}
.st-sw.on{box-shadow:0 0 0 3px var(--accent)}
.st-meter{height:10px;border-radius:5px;background:var(--line);overflow:hidden;max-width:420px}
.st-meter i{display:block;height:100%;background:var(--accent)}
.st-area{font:12.5px/1.5 var(--mono);min-height:84px;resize:vertical}
.st-kv{display:grid;grid-template-columns:auto 1fr;gap:2px 14px;font-variant-numeric:tabular-nums}
.st-kv dt{color:var(--ink-2)}.st-kv dd{margin:0}
@media (max-width:520px){.st-nav{width:100%;flex-direction:row;border-right:0;border-bottom:1px solid var(--line)}.st-main{flex-direction:column}}

/* ---- 共通: タブ・表 */
.tabs{flex:none;display:flex;gap:2px;padding:6px 8px 0;background:var(--surface-2);border-bottom:1px solid var(--line)}
.tab{padding:5px 14px;border:1px solid transparent;border-bottom:0;border-radius:7px 7px 0 0;background:none;cursor:pointer}
.tab.on{background:var(--surface);border-color:var(--line);margin-bottom:-1px;font-weight:600}
.pane{flex:1;min-height:0;overflow:auto;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.pane>*{flex:none}
.pane p{margin:0;color:var(--ink-2);max-width:46em}
.pane h3{margin:4px 0 0;font-size:14px}
.tbl{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.tbl th{text-align:left;font-weight:600;color:var(--ink-2);border-bottom:1px solid var(--line);padding:4px 8px;position:sticky;top:-12px;background:var(--surface)}
.tbl td{padding:4px 8px;border-bottom:1px solid var(--surface-2);overflow-wrap:anywhere}
.tbl td.num,.tbl th.num{text-align:right;white-space:nowrap}
.tbl tr.cur td{background:color-mix(in srgb,var(--accent) 12%,transparent)}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--accent)}
.badge{display:inline-block;padding:0 7px;border-radius:9px;font-size:11.5px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2);white-space:nowrap}
.note-warn{padding:8px 10px;border-radius:7px;background:#fff4d6;border:1px solid #e5c365;color:#5c4400!important}

/* ---- hCalc */
.hc{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px;padding:10px;overflow:auto}
.hc>*{flex:none}
.hc-expr{font:18px var(--mono);text-align:right}
.hc-res{font:600 26px/1.2 var(--mono);text-align:right;min-height:1.2em;overflow-wrap:anywhere}
.hc-res.err{color:var(--danger);font-size:15px}
.hc-alt{display:grid;grid-template-columns:auto 1fr;gap:1px 10px;font:12.5px var(--mono);color:var(--ink-2)}
.hc-alt dd{margin:0;text-align:right;overflow-wrap:anywhere;color:var(--ink)}
.hc-keys{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.hc-key{padding:8px 0;border:1px solid var(--line);border-radius:6px;background:#fff;cursor:pointer;font:14px var(--mono)}
.hc-key:hover{background:var(--surface-2)}
.hc-key.op{background:var(--surface-2)}
.hc-key.eq{background:var(--accent);color:#fff!important;border-color:transparent}
.hc-hist{display:flex;flex-direction:column;gap:2px;font:12.5px var(--mono)}
.hc-hist button{border:0;background:none;text-align:right;cursor:pointer;padding:2px 4px;border-radius:4px;color:var(--ink-2)}
.hc-hist button:hover{background:var(--surface-2)}

/* ---- hPaint */
.pt-stage{flex:1;min-height:0;overflow:auto;background:#8d9098;display:flex;padding:12px}
.pt-canvas{flex:none;margin:auto;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.4);touch-action:none;cursor:crosshair;image-rendering:pixelated}
.pt-canvas.hand{cursor:grab}
.pt-zoom{min-width:58px;justify-content:center;font-variant-numeric:tabular-nums}
.pt-colors{display:flex;gap:3px;align-items:center}
.pt-sw{width:18px;height:18px;border-radius:4px;border:1px solid rgba(0,0,0,.35);padding:0;cursor:pointer}
.pt-sw.on{outline:2px solid var(--accent);outline-offset:1px}
.pt-color{width:30px;height:24px;padding:0;border:1px solid var(--line);border-radius:4px;background:none}

/* ---- hSerial */
.hs-out{flex:1;min-height:0;overflow:auto;margin:0;padding:8px 10px;background:var(--tty-bg);color:var(--tty-ink);font:13px/1.45 var(--mono);white-space:pre-wrap;word-break:break-all;outline-offset:-2px}
.hs-send{flex:none;display:flex;gap:6px;padding:6px;background:var(--surface-2);border-top:1px solid var(--line)}
.hs-send .inp{font-family:var(--mono)}
.sel{font:inherit;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:6px;padding:3px 6px}

/* ---- タブレット / スマートフォンモード（#os-root に .touch と .tablet か .phone が付く） */
.p-title,.tabbar,.touch-only{display:none}
.p-mode{padding:0 7px}
.touch .p-mode{padding:0 10px}
.touch .touch-only{display:inline-flex}
#os-root.touch{font-size:16px}
.touch .panel{height:46px;font-size:15px;padding:0 8px;gap:6px}
.touch .p-btn{height:38px;padding:0 12px}
.touch .p-tasks{display:none}
.touch .p-title{display:block;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;padding:0 4px}
.touch .tabbar{flex:none;display:flex;height:56px;background:var(--panel);color:var(--panel-ink);z-index:5;padding-bottom:env(safe-area-inset-bottom,0)}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;border:0;background:none;cursor:pointer;font-size:11.5px}
.nav-btn:active{background:rgba(255,255,255,.16)}
.touch .win{border:0;border-radius:0;box-shadow:none}
.touch .win.free{border:1px solid #8d8f98;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.touch .win-head{height:46px;padding:0 6px 0 12px;font-size:15px}
.touch .win-title{font-size:15px}
.touch .win-btn{width:36px;height:36px}
.touch .de-htui .win-btns,.touch .rz{display:none} /* HTUi では閉じるが下のナビにあるので、右上のボタンは出さない */
.touch .win.free .rz{display:block}
.touch .rz-e,.touch .rz-w{width:12px}.touch .rz-n,.touch .rz-s{height:12px}.touch .rz-ne,.touch .rz-nw,.touch .rz-se,.touch .rz-sw{width:22px;height:22px}
.touch .btn{min-height:44px;padding:9px 16px}
.touch .btn.small{min-height:38px;padding:6px 12px;font-size:14px}
.touch .tbtn{min-height:42px;padding:8px 12px;flex:none}
.touch .inp,.touch .sel{font-size:16px;min-height:44px;padding:9px 10px}
.touch .toolbar{flex-wrap:nowrap;overflow-x:auto;gap:4px;padding:5px 8px;scrollbar-width:none}
.touch .toolbar .grow{min-width:170px;flex:1 0 170px}
.touch .toolbar .sep{flex:none}
.touch .statusbar{font-size:13px;padding:5px 12px}
.touch .menu{min-width:250px}
.touch .menu-item{padding:13px 14px;font-size:16px}
.touch .tab{padding:11px 16px}
.touch .desk-icons{inset:0;padding:26px 14px;flex-direction:row;flex-wrap:wrap;justify-content:center;align-content:flex-start;gap:20px 12px;overflow:auto}
.touch .desk-icon{width:104px;font-size:14px;gap:6px}
.touch .app-ico{width:64px;height:64px;border-radius:17px}
.touch .app-ico svg{width:36px;height:36px}
.touch .tty{font-size:15px}
.touch .tty-keys{display:flex}
.touch .he-text,.touch .he-gutter{font-size:15px}
.touch .hf-grid{grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px;padding:12px}
.touch .hf-item{padding:12px 4px;font-size:14px}
.touch .hf-item svg{width:44px;height:44px}
.touch .hf-side{width:168px}
.touch .hf-place{padding:11px 10px;font-size:15px}
.touch .fp-list{height:270px}
.touch .fp-item{padding:12px}
.touch .fp-places .btn{min-height:38px}
.touch .modal{width:480px}
.touch .tbl td,.touch .tbl th{padding:10px 8px}
.touch .hc-key{padding:15px 0;font-size:17px}
.touch .hc-expr{font-size:20px}
.touch .pt-sw{width:32px;height:32px;flex:none}
.touch .pt-color{width:46px;height:38px;flex:none}
.touch .st-sw{width:44px;height:44px}
.touch .st-sw.wp{width:92px;height:58px}
.touch .st-nav{width:170px}
.touch .hs-out{font-size:14px}
.hs-direct{display:inline-flex;align-items:center;gap:5px;white-space:nowrap;font-size:13px}
.switcher{position:absolute;inset:0;z-index:150000;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);display:flex;flex-direction:column;align-items:center;padding:20px 14px;gap:12px;color:#fff}
.sw-head{font-weight:600}
.sw-list{flex:1;min-height:0;overflow:auto;width:min(520px,100%);display:flex;flex-direction:column;gap:8px}
.sw-card{flex:none;display:flex;align-items:stretch;background:var(--surface);color:var(--ink);border-radius:12px;overflow:hidden}
.sw-open{flex:1;min-width:0;display:flex;align-items:center;gap:10px;padding:16px 14px;border:0;background:none;text-align:left;cursor:pointer;font-size:16px}
.sw-open span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sw-x{flex:none;width:54px;border:0;border-left:1px solid var(--line);background:none;cursor:pointer;display:flex;align-items:center;justify-content:center}
.sw-x:active,.sw-open:active{background:var(--surface-2)}
.sw-empty{text-align:center;opacity:.8}

/* スマートフォン: さらに1列の配置に */
.phone .panel .p-uname,.phone .p-lbl{display:none}
.phone .de-htui .win-head{display:none} /* HTUi ではタイトルは上のパネルに、閉じるは下のナビにあるので省く */
.phone .desk-icons{padding:20px 6px;gap:16px 2px}
.phone .desk-icon{width:84px;font-size:12.5px}
.phone .app-ico{width:58px;height:58px;border-radius:15px}
.phone .hf-main,.phone .st-main{flex-direction:column}
.phone .hf-side,.phone .st-nav{width:auto;flex:none;flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);scrollbar-width:none}
.phone .hf-place{flex:none;padding:9px 12px}
.phone .hf-place span:last-child{display:inline}
.phone .hf-grid{grid-template-columns:repeat(auto-fill,minmax(88px,1fr))}
.phone .modal-ov{align-items:flex-end;padding:0}
.phone .modal{width:100%!important;border-radius:18px 18px 0 0;max-height:94%}
.phone .modal-foot{padding-bottom:18px}
.phone .modal-foot .btn{flex:1 1 auto}
.phone .fp-list{height:220px}
.phone .st-page,.phone .pane{padding:12px}
.phone .st-card{padding:10px}
.phone .he-gutter{min-width:34px;padding-left:2px;padding-right:5px}
.phone .hc{padding:8px}
.phone .hs-send{flex-wrap:wrap}
.phone .hs-send .inp{flex:1 1 100%}
.phone .toast{bottom:74px}
.phone .gr-title{font-size:28px}
.phone .tbl{font-size:13.5px}
.phone .hb-page{padding:18px 12px}

/* ==================================================== hdm（ログイン画面）。#htui に .hdm と .hdm-<テーマ> が付く */
#htui.hdm{color:#fff}
.os-logo{font:700 15px/1 var(--mono);letter-spacing:.02em}
.os-logo b{color:#5fa8f5}
.hdm .avatar.sq{border-radius:0}
.hdm-ovsel{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:16px}
.hdm [data-shake].shake{animation:hdm-shake .4s ease-in-out}
@keyframes hdm-shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.gr-msg{min-height:1.4em}
.hdm-lock{position:absolute;inset:0;z-index:50;transition:transform .42s cubic-bezier(.4,0,.2,1),opacity .42s;touch-action:none;cursor:pointer}
.hdm-lock.out{transform:translateY(-100%)!important;opacity:.6;pointer-events:none}

/* ---- HTUi（独自デザイン） */
.hdm-htui{background-size:cover}
.hh-panel{flex:none;height:32px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 6px 0 12px;background:var(--panel);color:var(--panel-ink);font-size:13px;z-index:2}
.hh-brand{display:flex;align-items:center;gap:8px;font-weight:600}
.hh-clock{font-variant-numeric:tabular-nums}
.hh-right{display:flex;justify-content:flex-end;gap:2px}
.hh-pbtn{display:flex;align-items:center;justify-content:center;width:34px;height:26px;border:0;border-radius:6px;background:none;color:inherit!important;cursor:pointer}
.hh-pbtn:hover{background:rgba(255,255,255,.14)}
.hh-main{flex:1;min-height:0;overflow:auto;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.hh-card{width:min(360px,100%);display:flex;flex-direction:column;align-items:center;gap:10px;padding:30px 26px 22px;border-radius:18px;background:rgba(250,250,251,.94);color:var(--ink);box-shadow:0 24px 60px rgba(0,0,0,.35);text-align:center}
.hh-ring{padding:4px;border-radius:50%;background:conic-gradient(from 210deg,var(--accent),color-mix(in srgb,var(--accent) 40%,#fff),var(--accent))}
.hh-ring .avatar{border:3px solid #fff}
.hh-name{margin:4px 0 0;font-size:22px;font-weight:700}
.hh-title{margin:0;font-size:24px}
.hh-sub{margin:0;color:var(--ink-2);font-size:13px}
.hh-form{width:100%;margin-top:8px}
.hh-pwrow{display:flex;align-items:center;gap:0;border:1.5px solid var(--line);border-radius:10px;background:#fff;overflow:hidden;transition:border-color .15s,box-shadow .15s}
.hh-pwrow:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.hh-pw{flex:1;min-width:0;border:0!important;outline:0!important;background:none;padding:11px 12px;font:inherit;font-size:15px;color:var(--ink)}
.hh-go{flex:none;width:44px;align-self:stretch;border:0;background:var(--accent);color:#fff!important;display:flex;align-items:center;justify-content:center;cursor:pointer}
.hh-go:hover{filter:brightness(1.08)}
.hh-msg{color:#c01c28;font-size:13px}
.hh-ses{position:relative;display:flex;align-items:center;gap:6px;padding:4px 6px 4px 10px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);font-size:13px}
.hh-sel{border:0;background:none;font:inherit;color:var(--ink);padding:2px 2px;cursor:pointer;max-width:240px}
.hh-desc{margin:0;color:var(--ink-2);font-size:12px;line-height:1.5;min-height:3em}
.hh-users{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:8px}
.hh-user{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:96px;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)!important;cursor:pointer}
.hh-user:hover{border-color:var(--accent)}
.hh-others{position:absolute;left:14px;bottom:14px;display:flex;flex-wrap:wrap;gap:6px;max-width:calc(100% - 28px)}
.hh-chip{display:flex;align-items:center;gap:8px;padding:4px 12px 4px 4px;border:0;border-radius:999px;background:rgba(0,0,0,.35);color:#fff!important;cursor:pointer;backdrop-filter:blur(6px);font-size:13px}
.hh-chip.cur{background:rgba(255,255,255,.9);color:var(--ink)!important}
.hh-foot{position:absolute;right:14px;bottom:16px;font-size:11.5px;opacity:.6;letter-spacing:.05em;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.phone .hh-foot{display:none}

/* ---- hShell（GDM 風） */
.hdm-gdm{background:#2c2c30;font-family:var(--ui)}
.gd-bar{flex:none;height:30px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 6px;background:#000;font-size:13.5px}
.gd-clock{font-variant-numeric:tabular-nums}
.gd-sys{display:flex;justify-content:flex-end;gap:2px}
.gd-ibtn{display:flex;align-items:center;justify-content:center;width:34px;height:24px;border:0;border-radius:12px;background:none;color:#fff!important;cursor:pointer}
.gd-ibtn:hover{background:rgba(255,255,255,.16)}
.gd-main{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:16px}
.gd-list{width:min(360px,100%);display:flex;flex-direction:column;gap:2px}
.gd-row{display:flex;align-items:center;gap:16px;padding:10px 14px;border:0;border-radius:12px;background:none;color:#fff!important;font-size:17px;cursor:pointer;text-align:left}
.gd-row:hover,.gd-row:focus-visible{background:rgba(255,255,255,.1)}
.gd-link{border:0;background:none;color:rgba(255,255,255,.7)!important;font-size:13px;cursor:pointer;text-decoration:underline}
.gd-auth{display:flex;flex-direction:column;align-items:center;gap:14px;width:min(340px,100%)}
.gd-name{font-size:20px;font-weight:700}
.gd-form{width:100%}
.gd-pwrow{display:flex;align-items:center;gap:8px}
.gd-pw{flex:1;min-width:0;height:40px;border:2px solid transparent;border-radius:8px;background:#3d3d42;color:#fff;padding:0 12px;font:inherit;font-size:15px;outline:0!important}
.gd-pw:focus{border-color:color-mix(in srgb,var(--accent) 70%,#fff)}
.gd-go,.gd-back{flex:none;width:40px;height:40px;border:0;border-radius:50%;background:#3d3d42;color:#fff!important;display:flex;align-items:center;justify-content:center;cursor:pointer}
.gd-go{background:var(--accent)}
.gd-back:hover{background:#4a4a50}
.gd-msg{color:#ff8080;font-size:13px}
.gd-gear{position:absolute;right:20px;bottom:20px;width:44px;height:44px;border-radius:50%;background:#3d3d42;display:flex;align-items:center;justify-content:center;cursor:pointer}
.gd-gear:hover{background:#4a4a50}
.gd-logo{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);display:flex;align-items:center;gap:8px;font-size:16px;font-weight:700;opacity:.85}

/* ---- hWin デスクトップ（Windows 11 風） */
.hdm-w11{background:#000;font-family:"Segoe UI Variable","Segoe UI",var(--ui)}
.w11-bg{position:absolute;inset:-30px;background:var(--wall);filter:blur(28px) brightness(.7);transform:scale(1.05)}
.w11-center{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px}
.w11-name{font-size:28px;font-weight:600;margin-top:6px}
.w11-form{width:min(300px,100%)}
.w11-pwbox{display:flex;align-items:center;height:36px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-bottom:2px solid rgba(255,255,255,.55);border-radius:5px;backdrop-filter:blur(10px)}
.w11-pwbox:focus-within{border-bottom-color:var(--accent);background:rgba(0,0,0,.35)}
.w11-pw{flex:1;min-width:0;border:0!important;outline:0!important;background:none;color:#fff;padding:0 10px;font:inherit;font-size:14px}
.w11-pw::placeholder{color:rgba(255,255,255,.75)}
.w11-go{flex:none;width:32px;height:28px;margin-right:3px;border:0;border-radius:4px;background:rgba(255,255,255,.12);color:#fff!important;display:flex;align-items:center;justify-content:center;cursor:pointer}
.w11-go:hover{background:rgba(255,255,255,.22)}
.w11-msg{font-size:13px;color:#fff}
.w11-opt{font-size:13px;opacity:.85}
.w11-users{position:absolute;left:20px;bottom:20px;display:flex;flex-direction:column;gap:2px}
.w11-user{display:flex;align-items:center;gap:12px;padding:6px 16px 6px 6px;border:0;border-radius:5px;background:none;color:#fff!important;font-size:14px;cursor:pointer;text-align:left}
.w11-user:hover,.w11-user.cur{background:rgba(255,255,255,.12)}
.w11-icons{position:absolute;right:20px;bottom:20px;display:flex;gap:6px}
.w11-ibtn{position:relative;width:40px;height:40px;display:flex;align-items:center;justify-content:center;border:0;border-radius:5px;background:none;color:#fff!important;cursor:pointer}
.w11-ibtn:hover{background:rgba(255,255,255,.12)}
.w11-lock{display:flex;flex-direction:column;align-items:center;padding-top:9vh;text-shadow:0 2px 12px rgba(0,0,0,.35);overflow:hidden}
.w11-lockbg{position:absolute;inset:0;background:var(--wall);z-index:-1}
.w11-ltime{font-size:clamp(64px,13vw,120px);font-weight:600;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.w11-ldate{margin-top:10px;font-size:clamp(17px,2.5vw,24px);font-weight:500}

/* ---- hWin タブレット（Windows 8.1 風） */
.hdm-w8{background:var(--accent);font-family:"Segoe UI",var(--ui)}
.w8l-main{flex:1;display:flex;align-items:center;justify-content:center;gap:28px;padding:16px}
.w8l-back,.w8l-back-sp{flex:none;width:42px;height:42px}
.w8l-back{border:2px solid #fff;border-radius:50%;background:none;color:#fff!important;display:flex;align-items:center;justify-content:center;cursor:pointer}
.w8l-back:hover{background:rgba(255,255,255,.15)}
.w8l-side{display:flex;flex-direction:column;gap:12px;min-width:0}
.w8l-name{font:300 34px/1.1 var(--ui)}
.w8l-pwbox{display:flex;width:min(300px,60vw);height:36px;background:#fff}
.w8l-pw{flex:1;min-width:0;border:0!important;outline:0!important;padding:0 10px;font:inherit;font-size:15px;color:#000}
.w8l-go{flex:none;width:40px;border:0;background:#fff;color:#000!important;display:flex;align-items:center;justify-content:center;cursor:pointer;border-left:1px solid #ccc}
.w8l-go:hover{background:#e6e6e6}
.w8l-msg{font-size:14px;color:#fff}
.w8l-pick{display:none;position:absolute;left:0;right:0;bottom:84px;justify-content:center;gap:14px;padding:12px}
.w8l-pick.on{display:flex}
.w8l-user{display:flex;flex-direction:column;align-items:flex-start;gap:6px;border:0;background:none;color:#fff!important;cursor:pointer;font-size:14px}
.w8l-user.cur .avatar{outline:3px solid #fff}
.w8l-icons{position:absolute;right:26px;bottom:24px;display:flex;gap:14px}
.w8l-ibtn{position:relative;width:46px;height:46px;border:2px solid #fff;border-radius:50%;background:none;color:#fff!important;display:flex;align-items:center;justify-content:center;cursor:pointer}
.w8l-ibtn:hover{background:rgba(255,255,255,.15)}
.w8l-lock{background-size:cover!important}
.w8l-lclock{position:absolute;left:5vw;bottom:9vh;text-shadow:0 2px 10px rgba(0,0,0,.35)}
.w8l-ltime{font:200 clamp(80px,14vw,140px)/1 var(--ui);font-variant-numeric:tabular-nums}
.w8l-ldate{white-space:pre;font:300 clamp(20px,3vw,32px)/1.25 var(--ui);margin-top:8px}
.phone .w8l-main{flex-direction:column}

/* ---- hWin スマートフォン（Windows Phone 風） */
.hdm-wp{background:#000;font-family:"Segoe WP","Segoe UI",var(--ui)}
.wpl-status{flex:none;height:32px;display:flex;align-items:center;gap:10px;padding:0 10px 0 14px;font-size:14px;font-variant-numeric:tabular-nums}
.wpl-sbtns{margin-left:auto;display:flex;gap:2px}
.wpl-ibtn{width:32px;height:28px;border:0;background:none;color:#fff!important;display:flex;align-items:center;justify-content:center;cursor:pointer}
.wpl-main{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:12px;padding:10px 20px 20px}
.wpl-app{font-size:14px;font-weight:600;letter-spacing:.06em}
.wpl-title{margin:0;font:300 46px/1.1 var(--ui);letter-spacing:-.01em}
.wpl-who{display:flex;align-items:center;gap:12px;font-size:17px}
.wpl-form{display:flex;flex-direction:column;gap:14px}
.wpl-pw{height:44px;border:2px solid #fff;background:#fff;color:#000;padding:0 10px;font:inherit;font-size:17px;outline:0!important;border-radius:0}
.wpl-pw:focus{border-color:var(--accent)}
.wpl-btns{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.wpl-ok,.wpl-alt{height:46px;border:2px solid #fff;background:none;color:#fff!important;font:inherit;font-size:16px;cursor:pointer}
.wpl-ok{background:var(--accent);border-color:var(--accent)}
.wpl-ok:active,.wpl-alt:active{filter:brightness(1.2)}
.wpl-msg{color:#fff;font-size:14px}
.wpl-ses{display:flex;flex-direction:column;gap:6px;font-size:14px;opacity:.9}
.wpl-sel{height:44px;border:2px solid #fff;background:#000;color:#fff;font:inherit;font-size:16px;padding:0 8px;border-radius:0}
.wpl-users{display:none;flex-direction:column;gap:6px}
.wpl-users.on{display:flex}
.wpl-user{display:flex;align-items:center;gap:12px;border:0;background:none;color:#fff!important;font-size:17px;cursor:pointer;padding:4px 0;text-align:left}
.wpl-user.cur span{color:var(--accent)}
.wpl-lock{background-size:cover!important}
.wpl-lclock{position:absolute;left:24px;bottom:18%;text-shadow:0 2px 10px rgba(0,0,0,.4)}
.wpl-ltime{font:200 92px/1 var(--ui);font-variant-numeric:tabular-nums}
.wpl-ldate{white-space:pre;font:300 26px/1.25 var(--ui);margin-top:6px}
.wpl-hint{position:absolute;left:0;right:0;bottom:24px;text-align:center;font-size:13px;opacity:.85;text-shadow:0 1px 4px rgba(0,0,0,.5)}

/* ---- hwc（シンプル） */
.hdm-wm{background:#15171b;align-items:center;justify-content:center;font-family:var(--mono)}
.wm-box{width:min(380px,calc(100% - 32px));display:flex;flex-direction:column;gap:14px;padding:20px 22px;border:1px solid #33363e;background:#1d2026;color:#d9dbe0}
.wm-head{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:#8b93a1;padding-bottom:10px;border-bottom:1px solid #2c3038}
.wm-head b{color:#e9eaee;font-size:14px}
.wm-form{display:flex;flex-direction:column;gap:10px}
.wm-row{display:grid;grid-template-columns:96px 1fr;align-items:center;gap:10px;font-size:13px;color:#9aa0aa}
.wm-in{width:100%;min-width:0;height:32px;border:1px solid #3a3f4a;border-radius:2px;background:#121418;color:#e9eaee;font:13.5px var(--mono);padding:0 8px;outline:0!important}
.wm-in:focus{border-color:var(--accent)}
.wm-acts{display:flex;justify-content:flex-end}
.wm-go{height:32px;padding:0 18px;border:1px solid var(--accent);border-radius:2px;background:var(--accent);color:#fff!important;font:13px var(--mono);cursor:pointer}
.wm-msg{font-size:12.5px;color:#ff7b72}
.wm-foot{position:absolute;right:12px;bottom:10px;display:flex;gap:4px}
.wm-ibtn{width:30px;height:28px;border:1px solid transparent;border-radius:2px;background:none;color:#8b93a1!important;display:flex;align-items:center;justify-content:center;cursor:pointer}
.wm-ibtn:hover{border-color:#3a3f4a;color:#fff!important}
.phone .wm-row{grid-template-columns:1fr}

@media (prefers-reduced-motion:no-preference){
  .hdm-htui .hh-card{animation:rise .45s cubic-bezier(.2,.8,.2,1) both}
  .hdm-gdm .gd-auth,.hdm-gdm .gd-list{animation:fade-in .35s ease-out both}
  .hdm-w11 .w11-center{animation:pop .4s cubic-bezier(.2,.8,.2,1) both}
  .hdm-w8 .w8l-main{animation:w8-in .45s cubic-bezier(.2,.8,.2,1) both}
  .hdm-wp .wpl-main>*{animation:w8-in .35s cubic-bezier(.2,.8,.2,1) both}
  .hdm-wm .wm-box{animation:fade-in .25s ease-out both}
}

/* ==================================================== hWin（Windows 風） */
.de-win .desk{order:0}
.taskbar{order:1;flex:none;height:44px;display:flex;align-items:stretch;gap:2px;padding:0 0 0 4px;background:rgba(22,24,30,.92);color:#eef0f3;backdrop-filter:blur(10px);border-top:1px solid rgba(255,255,255,.08);z-index:5}
.de-win .tabbar{order:2}
.tb-start{flex:none;width:48px;border:0;background:none;color:#fff!important;cursor:pointer;display:flex;align-items:center;justify-content:center;border-radius:4px;margin:3px 0}
.tb-start:hover{background:rgba(255,255,255,.12)}
.tb-start .os-logo{font-size:16px}
.tb-tasks{flex:1;min-width:0;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding:3px 0}
.tb-tasks .p-task{height:auto;max-width:200px;border-radius:4px;background:rgba(255,255,255,.04);border-bottom:2px solid transparent;padding:0 10px}
.tb-tasks .p-task.active{background:rgba(255,255,255,.14);border-bottom-color:var(--accent)}
.tb-tray{flex:none;display:flex;align-items:stretch;margin-left:auto}
.tb-btn{border:0;background:none;color:#eef0f3!important;padding:0 10px;cursor:pointer;display:flex;align-items:center}
.tb-btn:hover{background:rgba(255,255,255,.12)}
.tb-clock{display:flex;align-items:center;padding:0 10px;white-space:pre;text-align:right;font-size:12px;line-height:1.3;font-variant-numeric:tabular-nums}
.tb-showdesk{width:8px;border:0;border-left:1px solid rgba(255,255,255,.15);background:none;cursor:pointer}
.tb-showdesk:hover{background:rgba(255,255,255,.2)}
.startmenu{position:absolute;left:6px;bottom:50px;z-index:100000;width:min(420px,calc(100% - 12px));max-height:calc(100% - 60px);display:flex;flex-direction:column;gap:8px;padding:16px 16px 0;background:rgba(32,35,42,.97);color:#eef0f3;border:1px solid rgba(255,255,255,.1);border-radius:10px;box-shadow:0 18px 50px rgba(0,0,0,.55)}
.sm-search{background:rgba(255,255,255,.95)}
.sm-label{font-size:12.5px;font-weight:600;opacity:.75;margin-top:4px}
.sm-grid{flex:1;min-height:0;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:4px;align-content:start}
.sm-app{display:flex;flex-direction:column;align-items:center;gap:5px;padding:9px 4px;border:0;border-radius:6px;background:none;color:#eef0f3!important;cursor:pointer;font-size:12.5px}
.sm-app:hover,.sm-app:focus-visible{background:rgba(255,255,255,.1)}
.sm-app .app-ico{width:36px;height:36px;border-radius:9px}
.sm-none{grid-column:1/-1;opacity:.7;text-align:center}
.sm-foot{flex:none;display:flex;justify-content:space-between;align-items:center;margin:4px -16px 0;padding:8px 12px;background:rgba(0,0,0,.25);border-radius:0 0 10px 10px}
.sm-user,.sm-power{display:flex;align-items:center;gap:8px;border:0;background:none;color:#eef0f3!important;padding:5px 8px;border-radius:6px;cursor:pointer}
.sm-user:hover,.sm-power:hover{background:rgba(255,255,255,.1)}
.de-win .win{border-radius:6px}
.de-win .win-head{height:32px;padding:0 0 0 10px;background:var(--surface)}
.de-win .win-btns{gap:0;align-self:stretch}
.de-win .win-btn{width:44px;height:100%;border-radius:0;background:none}
.de-win .win-btn:hover{background:rgba(0,0,0,.08)}
.de-win .win-btn.close:hover{background:#c42b1c}
.touch .taskbar{height:50px}
@media (prefers-reduced-motion:no-preference){ .startmenu{animation:rise .2s cubic-bezier(.2,.8,.2,1)} }

/* ---- 画面の端（スワイプ用の帯）。タッチモードのときだけ */
.edge{display:none;position:absolute;z-index:95000;touch-action:none}
.touch .edge{display:block}
.edge-l{left:0;top:0;bottom:0;width:10px}.edge-r{right:0;top:0;bottom:0;width:10px}
.edge-t{top:0;left:10px;right:10px;height:10px}.edge-b{bottom:0;left:10px;right:10px;height:10px}

/* ---- hWin をタブレット・スマートフォンで使うとき: Windows 8.1 風
   #htui に .w8-start-on（スタート画面）/ .w8-desk-on（デスクトップ）が付く */
.w8-start{display:none}
.touch .de-win .taskbar,.touch .de-win .desk-icons{display:none}
.touch .de-win.w8-desk-on .taskbar{display:flex}
.touch .de-win.w8-desk-on .desk-icons{display:flex}
.touch .de-win.w8-start-on .w8-start{display:block;position:absolute;inset:0;z-index:90000;overflow:hidden;background:color-mix(in srgb,var(--accent) 30%,#0c0f1d);color:#fff;--t:128px;--gap:8px}
.phone .de-win .w8-start{--t:calc((100vw - 2 * 14px - 2 * 8px) / 3)}
.w8-page{position:absolute;inset:0;display:flex;flex-direction:column;padding-top:22px;transition:transform .38s cubic-bezier(.2,.8,.2,1),opacity .3s}
.w8-apps{transform:translateY(100%);opacity:0;background:color-mix(in srgb,var(--accent) 22%,#0a0c16)}
.w8-start.apps .w8-home{transform:translateY(-30%);opacity:0;pointer-events:none}
.w8-start.apps .w8-apps{transform:none;opacity:1}
.phone .de-win .w8-apps{transform:translateX(100%)}
.phone .de-win .w8-start.apps .w8-home{transform:translateX(-30%)}
.phone .de-win .w8-start.apps .w8-apps{transform:none}


.w8-head{flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 24px 18px}
.w8-head h1{margin:0;font:300 34px/1 var(--ui);letter-spacing:.02em;display:flex;align-items:baseline;gap:14px}
.w8-head h1 small{font-size:15px;opacity:.75}
.w8-q{max-width:260px;background:rgba(255,255,255,.95)}
.w8-user{display:flex;align-items:center;gap:10px;border:0;background:none;color:#fff!important;font-size:16px;cursor:pointer;padding:4px;border-radius:4px}
.w8-user:active{background:rgba(255,255,255,.15)}
.w8-grid{flex:1;min-height:0;display:grid;gap:var(--gap);grid-auto-rows:var(--t);grid-template-columns:repeat(auto-fill,var(--t));grid-auto-flow:row dense;align-content:start;overflow:auto;padding:0 24px 70px;scrollbar-width:none}
.tablet .de-win .w8-grid{grid-template-columns:none;grid-template-rows:repeat(auto-fill,var(--t));grid-auto-columns:var(--t);grid-auto-flow:column dense;overflow-x:auto;overflow-y:hidden;justify-content:start;padding-bottom:70px}
.phone .de-win .w8-head{padding:0 14px 14px}
.phone .de-win .w8-head h1{font-size:28px}
.phone .de-win .w8-grid{padding:0 14px 70px}
.w8-tile{position:relative;display:flex;align-items:center;justify-content:center;border:0;padding:0;color:#fff!important;cursor:pointer;overflow:hidden;font-size:14px;transition:transform .12s}
.w8-tile:active{transform:scale(.95)}
.w8-tile:focus-visible{outline:3px solid #fff;outline-offset:-3px}
.w8-wide{grid-column:span 2}
.w8-name{position:absolute;left:10px;bottom:7px;right:8px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.w8-clock{flex-direction:column;align-items:flex-start;justify-content:flex-end;gap:2px;padding:12px 14px;background:#2a2d5c;cursor:default}
.w8-clock b{font:300 44px/1 var(--ui);font-variant-numeric:tabular-nums}
.w8-clock span{font-size:14px;opacity:.9}
.w8-desktile{background-size:cover!important}
.w8-mini-bar{position:absolute;left:0;right:0;bottom:0;height:16%;background:rgba(20,22,28,.85)}
.w8-desktile .w8-name{bottom:calc(16% + 6px)}
.w8-more{position:absolute;left:22px;bottom:18px;width:40px;height:40px;border-radius:50%;border:2px solid rgba(255,255,255,.8);background:rgba(0,0,0,.15);color:#fff!important;display:flex;align-items:center;justify-content:center;cursor:pointer}
.w8-more:active{background:rgba(255,255,255,.2)}
.phone .de-win .w8-more{left:14px}
.w8-alist{flex:1;min-height:0;overflow:auto;padding:0 24px 70px;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));grid-auto-rows:min-content;gap:4px 16px;align-content:start;scrollbar-width:none}
.tablet .de-win .w8-alist{grid-template-columns:none;grid-template-rows:repeat(auto-fill,48px);grid-auto-columns:230px;grid-auto-flow:column;overflow-x:auto;overflow-y:hidden;touch-action:pan-x}
.phone .de-win .w8-alist{grid-template-columns:1fr;padding:0 14px 70px;touch-action:pan-y}
.w8-letter{font:300 26px/48px var(--ui);padding-left:4px;opacity:.9}
.w8-aitem{display:flex;align-items:center;gap:12px;height:48px;padding:0 6px;border:0;background:none;color:#fff!important;cursor:pointer;text-align:left;font-size:15px}
.w8-aitem:active,.w8-aitem:focus-visible{background:rgba(255,255,255,.12)}
.w8-aico{width:38px;height:38px;flex:none;display:flex;align-items:center;justify-content:center}
.w8-none{opacity:.75;padding:8px 4px;grid-column:1/-1}
/* モダンアプリ（全画面）はタイトルバーを隠す。上端をタップすると出る（.peek） */
.touch .de-win .win:not(.free) .win-head{position:absolute;left:0;right:0;top:0;z-index:6;transform:translateY(-100%);opacity:0;pointer-events:none;transition:transform .2s,opacity .2s;box-shadow:0 2px 10px rgba(0,0,0,.25)}
.touch .de-win .win.peek:not(.free) .win-head{transform:none;opacity:1;pointer-events:auto}
.touch .de-win .win:not(.free) .win-btn:nth-child(2){display:none}
.touch .de-win .win{transition:transform .25s cubic-bezier(.2,.8,.2,1),border-radius .2s}
/* チャーム */
.w8-charmwrap{position:absolute;inset:0;z-index:96000;pointer-events:none}
.w8-charms{position:absolute;right:0;top:0;bottom:0;width:96px;display:flex;flex-direction:column;justify-content:center;gap:4px;background:#111;pointer-events:auto;box-shadow:-4px 0 18px rgba(0,0,0,.4)}
.w8-charm{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 0;border:0;background:none;color:#fff!important;cursor:pointer;font-size:13px}
.w8-charm:active,.w8-charm:focus-visible{background:rgba(255,255,255,.14)}
.w8-clogo{display:flex;color:#fff}
.w8-cc{position:absolute;left:40px;bottom:50px;display:flex;align-items:flex-end;gap:18px;padding:22px 30px;background:rgba(17,17,17,.92);color:#fff;pointer-events:none}
.w8-cc b{font:200 80px/1 var(--ui);font-variant-numeric:tabular-nums}
.w8-cc span{white-space:pre;font-size:20px;line-height:1.3}
.phone .w8-cc{left:12px;bottom:20px;padding:14px 18px}.phone .w8-cc b{font-size:52px}.phone .w8-cc span{font-size:15px}
.w8-pane{position:absolute;right:0;top:0;bottom:0;z-index:96000;width:min(340px,100%);display:flex;flex-direction:column;gap:10px;padding:24px 20px;background:#1d2a4a;color:#fff}
.w8-pane h2{margin:0;font:300 28px var(--ui)}
.w8-pane p{margin:0;opacity:.75}
.w8-pane-list{display:flex;flex-direction:column;gap:4px;margin-top:10px}
.w8-pane-item{display:flex;align-items:center;gap:12px;padding:12px 10px;border:0;background:none;color:#fff!important;cursor:pointer;font-size:16px;text-align:left}
.w8-pane-item:active,.w8-pane-item:hover{background:rgba(255,255,255,.12)}
/* 左端の切り替え一覧 */
.w8-switch{position:absolute;left:0;top:0;bottom:0;z-index:96000;width:150px;display:flex;flex-direction:column;gap:10px;padding:16px 12px;overflow:auto;background:#111;color:#fff;box-shadow:4px 0 18px rgba(0,0,0,.4)}
.w8-sw{display:flex;flex-direction:column;gap:6px;border:0;background:none;color:#fff!important;cursor:pointer;font-size:12.5px;text-align:left;padding:0}
.w8-sw span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.w8-sw-thumb{width:100%;aspect-ratio:16/10;display:flex;align-items:center;justify-content:center;background:#2b2e36;outline:2px solid transparent}
.w8-sw:active .w8-sw-thumb,.w8-sw:focus-visible .w8-sw-thumb{outline-color:#fff}
@media (prefers-reduced-motion:no-preference){
  .touch .de-win.w8-start-on .w8-home .w8-tile{animation:w8-in .45s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 28ms)}
  @keyframes w8-in{from{opacity:0;transform:perspective(600px) rotateY(-55deg) translateX(40px)}to{opacity:1;transform:none}}
  .w8-charms{animation:w8-charm-in .22s cubic-bezier(.2,.8,.2,1)}
  @keyframes w8-charm-in{from{transform:translateX(100%)}to{transform:none}}
  .w8-cc{animation:fade-in .25s ease-out}
  .w8-pane{animation:w8-charm-in .25s cubic-bezier(.2,.8,.2,1)}
  .w8-switch{animation:w8-sw-in .22s cubic-bezier(.2,.8,.2,1)}
  @keyframes w8-sw-in{from{transform:translateX(-100%)}to{transform:none}}
}

/* ==================================================== hShell（GNOME 風） */
.gn-bar{flex:none;height:30px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 4px;background:#000;color:#f4f4f5;font-size:13.5px;font-weight:600;z-index:5}
.gn-left{display:flex;align-items:center;gap:6px;min-width:0}
.gn-act{border:0;background:none;color:inherit!important;padding:3px 10px;border-radius:14px;cursor:pointer;font-weight:600}
.gn-act:hover,.gn-status:hover,.gn-btn:hover{background:rgba(255,255,255,.16)}
.gn-app{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;opacity:.9}
.gn-clock{position:relative;display:flex;align-items:center;gap:6px;border:0;background:none;color:inherit!important;font:inherit;font-variant-numeric:tabular-nums;padding:3px 12px;border-radius:14px;cursor:pointer}
.gn-clock:hover{background:rgba(255,255,255,.16)}
.gn-dot{width:6px;height:6px;border-radius:50%;background:#fff;display:none}
.gn-dot.on{display:block}
.gn-banner{position:absolute;top:38px;left:50%;transform:translateX(-50%);z-index:150000;width:min(420px,calc(100% - 16px));display:flex;align-items:center;gap:12px;padding:12px 14px;border:0;border-radius:14px;background:#2b2d33;color:#f4f4f5!important;text-align:left;cursor:pointer;box-shadow:0 10px 30px rgba(0,0,0,.45);transition:opacity .3s,transform .3s}
.gn-banner.out{opacity:0;transform:translate(-50%,-12px)}
.gn-nico{flex:none;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center}
.gn-ntext{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;font-size:13px;font-weight:400}
.gn-ntext b{font-size:13.5px}
.gn-ntext span{overflow-wrap:anywhere;opacity:.85}
.gn-cal{position:absolute;top:36px;left:50%;transform:translateX(-50%);z-index:150000;width:min(720px,calc(100% - 16px));max-height:calc(100% - 48px);display:grid;grid-template-columns:1fr 290px;gap:0;background:#26272c;color:#f4f4f5;border-radius:16px;box-shadow:0 14px 40px rgba(0,0,0,.5);overflow:hidden;font-size:13.5px}
.gn-ncol{display:flex;flex-direction:column;min-height:0;min-width:0;border-right:1px solid rgba(255,255,255,.08)}
.gn-nlist{flex:1;min-height:200px;overflow:auto;display:flex;flex-direction:column;gap:6px;padding:12px}
.gn-note{display:flex;align-items:flex-start;gap:10px;padding:10px;border-radius:12px;background:rgba(255,255,255,.07)}
.gn-napp{font-size:11.5px;opacity:.65!important}
.gn-nx{flex:none;width:24px;height:24px;border:0;border-radius:50%;background:rgba(255,255,255,.1);color:#fff!important;cursor:pointer;display:flex;align-items:center;justify-content:center}
.gn-nempty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;opacity:.5}
.gn-nfoot{flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border-top:1px solid rgba(255,255,255,.08)}
.gn-nfoot .btn{background:rgba(255,255,255,.12);border-color:transparent;color:#fff!important}
.gn-switch{display:flex;align-items:center;gap:8px;cursor:pointer}
.gn-switch input{position:absolute;opacity:0;width:1px;height:1px}
.gn-knob{width:38px;height:22px;border-radius:11px;background:rgba(255,255,255,.2);position:relative;transition:background .15s}
.gn-knob::after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s}
.gn-switch input:checked+.gn-knob{background:var(--accent)}
.gn-switch input:checked+.gn-knob::after{transform:translateX(16px)}
.gn-switch input:focus-visible+.gn-knob{outline:2px solid var(--accent);outline-offset:2px}
.gn-ccol{display:flex;flex-direction:column;gap:8px;padding:14px}
.gn-today{display:flex;flex-direction:column;gap:2px}
.gn-today span{opacity:.75}
.gn-today b{font-size:17px}
.gn-mhead{display:flex;align-items:center;justify-content:space-between}
.gn-mnav,.gn-mtoday{border:0;background:none;color:#fff!important;cursor:pointer;border-radius:14px;padding:5px 8px;display:flex;align-items:center}

/* ---- アニメーション（設定 → 外観 でオフにできる。OS側の「アニメーションを減らす」設定には従わず、htmlOSの設定だけで決まる） */

#htui.desktop .desk-icon:nth-child(5){animation-delay:.16s}#htui.desktop .desk-icon:nth-child(6){animation-delay:.2s}#htui.desktop .desk-icon:nth-child(n+7){animation-delay:.24s}

/* hWin（タッチ）でアプリを全画面で開いているとき: 上と下に帯（つまみ）を出し、アプリはその間に置く。
   画面のいちばん端から始まるスワイプは、全画面表示ではブラウザや OS が先に受け取ってしまう（アドレスバーやシェルフが出る）ので、
   端から離れたこの帯から操作する。上の帯: 引き下ろすと閉じる・タップでタイトルバー。下の帯: 上へスワイプかタップでアプリバー */
