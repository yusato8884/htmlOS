<!DOCTYPE html>
<html lang="ja">

<meta charset="utf-8">

<title>htmlOS</title>
<style>
/* ブートローダ / インストーラ専用の最小スタイル。OS本体のスタイルは /sys/style.css にあります */
html,body{height:100%;margin:0;overscroll-behavior:none}
body{background:#000;color:#d6d8dc;font:14px/1.5 ui-monospace,"DejaVu Sans Mono","Noto Sans Mono CJK JP",Menlo,Consolas,monospace;overflow:hidden}
#boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box;overflow:auto}
#boot.inst{background:#1c3f94}
.bl-box{width:min(620px,100%);border:1px solid #9aa0a6;background:#000;padding:0}
.bl-head{background:#9aa0a6;color:#000;padding:2px 10px;text-align:center}
.bl-list{padding:10px}
.bl-item{display:block;width:100%;text-align:left;background:none;border:0;color:inherit;font:inherit;padding:3px 8px;cursor:pointer}
@media (pointer:coarse){.bl-item{padding:11px 8px}.in-btn{padding:10px 18px}}
.bl-item.sel{background:#d6d8dc;color:#000}
.bl-item:focus-visible{outline:1px dashed #fff}
.bl-foot{padding:8px 10px;border-top:1px solid #444;color:#9aa0a6;white-space:pre-wrap}
.in-box{width:min(560px,100%);background:#c9ccd1;color:#111;box-shadow:10px 10px 0 rgba(0,0,0,.45)}
.in-head{background:#8f1d1d;color:#fff;padding:3px 12px}
.in-body{padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.in-body p{margin:0}
.in-row{display:flex;flex-direction:column;gap:2px}
.in-row input[type=text],.in-row input[type=password]{font:inherit;font-size:16px;padding:4px 6px;border:1px solid #333;background:#fff;color:#000;border-radius:0}
.in-radio{display:flex;gap:16px;flex-wrap:wrap}
.in-btns{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.in-btn{font:inherit;padding:3px 14px;border:1px solid #111;background:#e6e7ea;color:#111;cursor:pointer}
.in-btn:hover,.in-btn:focus-visible{background:#8f1d1d;color:#fff;outline:none}
.in-err{color:#8f1d1d;min-height:1.5em}
.in-log{background:#000;color:#d6d8dc;padding:8px;height:180px;overflow:auto;white-space:pre-wrap}
#boot.post-scr{align-items:stretch;justify-content:flex-start}
.post-wrap{flex:1;display:flex;flex-direction:column;gap:14px;min-height:100%}
.post-head{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.post-headtext b{color:#fff;font-size:16px}
.bios-logo{font-weight:700;font-size:40px;line-height:1;color:#fff;border:2px solid #d6d8dc;padding:8px 12px;letter-spacing:.05em}
.bios-logo b{color:#5fa8f5}
.post{white-space:pre-wrap;line-height:1.6;flex:1}
.post b{color:#fff}
.post .ok,.dim.ok{color:#7ee787}
.post .warn{color:#f5c211}
.dim{color:#8b93a1}
.post-hint{align-self:flex-start;background:none;border:0;color:#9aa0a6;font:inherit;padding:8px 0;cursor:pointer;text-align:left}
.post-hint.on{color:#fff}
.post-quiet{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
.post-quiet .bios-logo{font-size:64px;padding:14px 22px}
.post-qname{color:#fff;letter-spacing:.3em}
.post-dots{color:#5fa8f5;letter-spacing:.2em}
#boot.bios-scr{background:#00003a}
.bs{width:min(780px,100%);background:#b4b4b4;color:#000;border:2px solid #e8e8e8;display:flex;flex-direction:column}
.bs-title{background:#0b2a8a;color:#fff;text-align:center;padding:3px}
.bs-tabs{background:#0b2a8a;display:flex;padding:0 8px}
.bs-tab{font:inherit;border:0;background:none;color:#cfd6ff;padding:4px 16px;cursor:pointer}
.bs-tab.on{background:#b4b4b4;color:#0b2a8a;font-weight:700}
.bs-body{display:flex;min-height:300px}
.bs-items{flex:1;min-width:0;padding:12px 10px;border-right:2px solid #0b2a8a;display:flex;flex-direction:column;gap:2px}
.bs-item{display:flex;justify-content:space-between;gap:12px;width:100%;box-sizing:border-box;text-align:left;font:inherit;border:0;background:none;color:#0b2a8a;padding:3px 8px;cursor:pointer}
.bs-item.sel{background:#0b2a8a;color:#fff}

.bs-val{text-align:right;overflow-wrap:anywhere}
.bs-help{width:36%;box-sizing:border-box;padding:12px 10px;color:#0b2a8a;white-space:pre-wrap}
.bs-note{margin-top:12px;color:#8f1d1d}

@media (max-width:560px){.bs-body{flex-direction:column}.bs-items{border-right:0;border-bottom:2px solid #0b2a8a}.bs-help{width:100%}}
@media (pointer:coarse){.bs-item,.bs-tab{padding-top:10px;padding-bottom:10px}}
.panic{width:min(720px,100%);white-space:pre-wrap}
.panic b{color:#ff6b6b}

<script type="text/x-htmlos" data-path="/sys/apps/10-terminal.js">
/* Terminal — jsh のコンソール */
(function () {
  const OS = window.OS;
  OS.registerApp({
    id: 'terminal', name: 'Terminal', icon: 'terminal', color: '#2e3436', desc: 'jsh コンソール',
    launch(arg) {
      const win = OS.htui.open({ title: 'Terminal', icon: 'terminal', w: 660, h: 400, app: 'terminal' });
      const tty = new OS.Tty(win.body);
      const sh = new OS.Jsh(tty, OS.htui.user, { cmd: arg && arg.cmd });
      win.onFocus = () => tty.focus();
      win.onDispose = () => { sh.exited = true; tty.dispose(); };
      tty.focus();
      sh.loop().then(() => win.close(true));
      return win;
    }
  });
})();
</script>
<script type="text/x-htmlos" data-path="/sys/apps/20-hedit.js">
/* hedit — テキストエディター */
(function () {
  const OS = window.OS, h = OS.h, path = OS.path, ui = OS.ui;
  OS.registerApp({
    id: 'hedit', name: 'hedit', icon: 'edit', color: '#e66100', desc: 'テキストエディター',
    launch(arg) {
      const fsx = OS.htui.fs, home = OS.users.home(OS.htui.user);
      let file = null, dirty = false;
      const win = OS.htui.open({ title: 'hedit', icon: 'edit', w: 720, h: 470, app: 'hedit' });
      const ta = h('textarea', { class: 'he-text', spellcheck: 'false', id: 'he-text-' + win.pid, 'aria-label': '本文' });
      const gut = h('div', { class: 'he-gutter', 'aria-hidden': 'true' }, '1');
      const stPos = h('span'), stInfo = h('span', { class: 'grow' }), stKind = h('span');
      const tb = (icon, label, fn, title) => h('button', { class: 'tbtn', type: 'button', title: title || label, onclick: fn }, icon ? OS.icon(icon, 16) : null, label);
      const bRun = tb('play', '実行', runIt, 'jshスクリプトとして Terminal で実行');
      const bWrap = tb(null, '折り返し', () => { ta.classList.toggle('wrap'); bWrap.classList.toggle('on'); gut.style.display = ta.classList.contains('wrap') ? 'none' : ''; });
      const findInp = h('input', { class: 'inp', id: 'he-find-' + win.pid, placeholder: '検索する文字列', 'aria-label': '検索' });
      const findBar = h('div', { class: 'he-find', style: 'display:none' }, findInp,
        h('button', { class: 'btn small', type: 'button', onclick: () => findNext() }, '次を検索'),
        h('button', { class: 'btn small', type: 'button', onclick: () => { findBar.style.display = 'none'; ta.focus(); } }, '閉じる'));
      win.body.append(
        h('div', { class: 'toolbar' }, tb('file', '新規', newDoc), tb('folder', '開く', openDlg), tb('save', '保存', save), tb(null, '別名で保存', saveAs),
          h('span', { class: 'sep' }), tb('search', '検索', showFind), bWrap, bRun,
          h('button', { class: 'tbtn touch-only', type: 'button', title: '字下げ（空白2つ）を入れる', onpointerdown: e => { e.preventDefault(); ta.focus(); ta.setRangeText('  ', ta.selectionStart, ta.selectionEnd, 'end'); setDirty(true); } }, 'Tab')),
        findBar, h('div', { class: 'he-wrap' }, gut, ta), h('div', { class: 'statusbar' }, stInfo, stKind, stPos));

      let lines = 1;
      function refresh() {
        const n = ta.value.split('\n').length;
        if (n !== lines) { lines = n; const a = []; for (let i = 1; i <= n; i++) a.push(i); gut.textContent = a.join('\n'); }
        gut.scrollTop = ta.scrollTop;
        const before = ta.value.slice(0, ta.selectionStart).split('\n');
        stPos.textContent = '行 ' + before.length + '、列 ' + (before[before.length - 1].length + 1);
        stInfo.textContent = (file || '無題') + (dirty ? ' ・ 未保存' : '');
        stKind.textContent = ta.value.length + ' 文字';
        win.setTitle((dirty ? '● ' : '') + (file ? path.base(file) : '無題') + ' — hedit');
        bRun.disabled = !(file && /\.(js|jsh)$/.test(file));
      }
      const setDirty = d => { dirty = d; refresh(); };
      ta.addEventListener('input', () => setDirty(true));
      ta.addEventListener('scroll', () => { gut.scrollTop = ta.scrollTop; });
      ['keyup', 'click', 'select'].forEach(ev => ta.addEventListener(ev, refresh));
      ta.addEventListener('keydown', e => {
        if (e.key === 'Tab' && !e.ctrlKey && !e.altKey) { e.preventDefault(); ta.setRangeText('  ', ta.selectionStart, ta.selectionEnd, 'end'); setDirty(true); }
      });
      win.el.addEventListener('keydown', e => {
        if (!(e.ctrlKey || e.metaKey)) return;
        const k = e.key.toLowerCase();
        if (k === 's') { e.preventDefault(); if (e.shiftKey) saveAs(); else save(); }
        else if (k === 'o') { e.preventDefault(); openDlg(); }
        else if (k === 'f') { e.preventDefault(); showFind(); }
      });
      findInp.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); findNext(); } else if (e.key === 'Escape') { findBar.style.display = 'none'; ta.focus(); } });

      function showFind() { findBar.style.display = 'flex'; const s = ta.value.slice(ta.selectionStart, ta.selectionEnd); if (s && !s.includes('\n')) findInp.value = s; findInp.focus(); findInp.select(); }
      function findNext() {
        const q = findInp.value; if (!q) return;
        let i = ta.value.indexOf(q, ta.selectionEnd);
        if (i < 0) i = ta.value.indexOf(q);
        if (i < 0) { ui.toast('「' + q + '」は見つかりません'); return; }
        ta.focus(); ta.setSelectionRange(i, i + q.length);
        const line = ta.value.slice(0, i).split('\n').length, lh = parseFloat(getComputedStyle(ta).lineHeight) || 20;
        ta.scrollTop = Math.max(0, (line - 4) * lh);
        refresh();
      }
      async function discardOk() {
        if (!dirty) return true;
        const r = await ui.modal({ title: '変更を保存しますか?', body: h('p', { class: 'modal-msg' }, (file ? path.base(file) : '無題') + ' への変更が保存されていません。'),
          buttons: [{ label: 'キャンセル', cancel: true, value: 'cancel' }, { label: '保存しない', danger: true, value: 'discard' }, { label: '保存', primary: true, value: 'save' }] });
        if (r === 'save') return save();
        return r === 'discard';
      }
      function load(p) {
        try {
          const s = fsx.stat(p);
          if (s && s.t === 'f' && s.b) throw new Error(path.base(p) + ' はバイナリファイルなので hedit では開けません');
          ta.value = fsx.read(p); file = p; ta.setSelectionRange(0, 0); ta.scrollTop = 0; setDirty(false);
        } catch (e) { ui.alert(e.message); }
      }
      async function newDoc() { if (await discardOk()) { ta.value = ''; file = null; setDirty(false); ta.focus(); } }
      async function openDlg() {
        if (!(await discardOk())) return;
        const p = await ui.pickFile({ mode: 'open', dir: file ? path.dir(file) : home + '/Documents' });
        if (p) load(p);
      }
      async function write(p) {
        try { fsx.write(p, ta.value); file = p; setDirty(false); return true; }
        catch (e) {
          // 書けない場所（/sys など）は、root のパスワードを確認できたら root として保存する
          if (/許可がありません/.test(e.message) && (await ui.asRoot(p + ' を保存します。'))) {
            try { OS.fs.write(p, ta.value, { owner: 'root' }); file = p; setDirty(false); ui.toast('root として保存しました'); return true; }
            catch (e2) { ui.alert('保存できませんでした。\n' + e2.message); return false; }
          }
          if (!/許可がありません/.test(e.message)) ui.alert('保存できませんでした。\n' + e.message);
          return false;
        }
      }
      async function save() { return file ? write(file) : saveAs(); }
      async function saveAs() {
        const p = await ui.pickFile({ mode: 'save', allowRoot: true, dir: file ? path.dir(file) : home + '/Documents', name: file ? path.base(file) : '無題.txt' });
        if (!p) return false;
        if (p !== file && fsx.exists(p) && !(await ui.confirm(path.base(p) + ' はすでにあります。上書きしますか?', { ok: '上書き', danger: true }))) return false;
        return write(p);
      }
      async function runIt() {
        if (!file) return;
        if (dirty && !(await save())) return;
        OS.htui.run('terminal', { cmd: 'run ' + JSON.stringify(file) });
      }

      win.onClose = discardOk;
      win.onFocus = () => ta.focus();
      if (typeof arg === 'string' && arg) {
        if (fsx.exists(arg)) load(arg); else { file = arg; setDirty(false); }
      } else refresh();
      ta.focus();
      return win;
    }
  });
})();
</script>
<script type="text/x-htmlos" data-path="/sys/apps/30-hbrowser.js">
/* hBrowser — webブラウザー
   直接モード: iframe にそのまま表示（速いが、埋め込みを拒否するサイトは真っ白になる）
   プロキシモード: CORSプロキシ経由でHTMLを取得して表示（埋め込み拒否のサイトも読める。スクリプトの多いサイトは崩れる）
   ダウンロードは hFS（LocalStorage）の ~/Downloads に保存します。 */
(function () {
  const OS = window.OS, h = OS.h, path = OS.path, ui = OS.ui;
  const DEFAULT_MARKS = [
    { title: 'Wikipedia', url: 'https://ja.wikipedia.org/' },
    { title: 'example.com', url: 'https://example.com/' },
    { title: 'OpenStreetMap', url: 'https://www.openstreetmap.org/export/embed.html?bbox=139.50,35.68,139.62,35.73&layer=mapnik' },
    { title: 'welcome.html（hFS）', url: 'hfs:~/Documents/welcome.html' }
  ];
  const DL_EXT = /\.(zip|gz|tgz|7z|rar|pdf|mp3|wav|flac|m4a|mp4|webm|mov|uf2|bin|hex|iso|deb|exe|apk)$/i;
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  // プロキシ表示したページの中で動かす小さなスクリプト（リンクとフォームを親に伝える）
  function pageAgent() {
    document.addEventListener('click', function (e) {
      var a = e.target && e.target.closest && e.target.closest('a[href]');
      if (!a) return;
      var raw = a.getAttribute('href') || '';
      if (raw.charAt(0) === '#') {
        e.preventDefault();
        var t = document.getElementById(raw.slice(1)) || document.getElementsByName(raw.slice(1))[0];
        if (t) t.scrollIntoView();
        return;
      }
      if (!/^https?:/i.test(a.href)) return;
      e.preventDefault();
      parent.postMessage({ hbrowser: 1, nav: a.href, dl: a.hasAttribute('download') }, '*');
    }, true);
    document.addEventListener('submit', function (e) {
      var f = e.target; e.preventDefault();
      if ((f.getAttribute('method') || 'get').toLowerCase() !== 'get') { parent.postMessage({ hbrowser: 1, note: 'post' }, '*'); return; }
      var u = new URL(f.getAttribute('action') || '', document.baseURI);
      u.search = '';
      new FormData(f).forEach(function (v, k) { if (typeof v === 'string') u.searchParams.append(k, v); });
      parent.postMessage({ hbrowser: 1, nav: u.href }, '*');
    }, true);
  }

  OS.registerApp({
    id: 'hbrowser', name: 'hBrowser', icon: 'globe', color: '#1c71d8', desc: 'webブラウザー',
    launch(arg) {
      const fsx = OS.htui.fs, home = OS.users.home(OS.htui.user), cfgPath = home + '/.config/hbrowser.json';
      let cfg = { marks: DEFAULT_MARKS, proxy: false };
      try { cfg = Object.assign(cfg, JSON.parse(fsx.read(cfgPath))); } catch (e) { /* 初回 */ }
      const saveCfg = () => { try { fsx.mkdir(home + '/.config', { parents: true }); fsx.write(cfgPath, JSON.stringify(cfg, null, 1)); } catch (e) { /* 保存できなくても続行 */ } };

      const win = OS.htui.open({ title: 'hBrowser', icon: 'globe', w: 860, h: 540, app: 'hbrowser' });
      const hist = []; let hi = -1, cur = 'about:home', frame = null, lastHtml = null, seq = 0;
      const url = h('input', { class: 'inp hb-url', id: 'hb-url-' + win.pid, placeholder: 'URL、検索語、または hFS のパス（/home/…）', 'aria-label': 'アドレス', spellcheck: 'false' });
      const view = h('div', { class: 'hb-view' }), status = h('span', { class: 'grow' });
      const tb = (icon, title, fn) => h('button', { class: 'tbtn', type: 'button', title: title, 'aria-label': title, onclick: fn }, OS.icon(icon, 16));
      const bBack = tb('back', '戻る', () => { if (hi > 0) go(hist[--hi], false); });
      const bFwd = tb('fwd', '進む', () => { if (hi < hist.length - 1) go(hist[++hi], false); });
      const bProxy = h('button', { class: 'tbtn', type: 'button', title: 'プロキシモード: 埋め込みを拒否するサイトをCORSプロキシ経由で表示します', onclick: () => { cfg.proxy = !cfg.proxy; saveCfg(); paint(); go(cur, false); } }, OS.icon('shield', 16), 'プロキシ');
      win.body.append(
        h('form', { class: 'toolbar', onsubmit: e => { e.preventDefault(); go(url.value); } },
          bBack, bFwd, tb('reload', '再読み込み', () => go(cur, false)), tb('home', 'ホーム', () => go('about:home')),
          h('span', { class: 'grow' }, url), bProxy,
          tb('star', 'このページをブックマーク', addMark),
          h('button', { class: 'tbtn', type: 'button', title: 'ダウンロード', 'aria-label': 'ダウンロード', onclick: e => OS.htui.menu(e.currentTarget, [
            { label: 'このページのHTMLを保存', icon: 'save', act: savePage },
            { label: 'URLを指定してダウンロード', icon: 'download', act: async () => { const u = await ui.prompt('ダウンロードするURL', /^https?:/.test(cur) ? cur : 'https://', { title: 'ダウンロード' }); if (u) download(u); } },
            { label: 'Downloads フォルダを開く', icon: 'folder', act: () => OS.htui.run('hfile', home + '/Downloads') }
          ], true) }, OS.icon('download', 16))),
        view, h('div', { class: 'statusbar' }, status));

      function paint() {
        bBack.disabled = hi <= 0; bFwd.disabled = hi >= hist.length - 1;
        bProxy.classList.toggle('on', !!cfg.proxy);
      }
      function fix(u) {
        u = String(u || '').trim();
        if (!u) return 'about:home';
        if (/^hfs:/i.test(u)) return 'hfs:' + path.norm(u.slice(4), '/', home);
        if (/^(about:|https?:\/\/)/i.test(u)) return u;
        if (u.startsWith('/') || u.startsWith('~')) return 'hfs:' + path.norm(u, '/', home);
        if (/^[\w-]+(\.[\w-]+)+(:\d+)?(\/\S*)?$/.test(u) || /^localhost(:\d+)?(\/\S*)?$/.test(u)) return 'https://' + u;
        return 'https://html.duckduckgo.com/html/?q=' + encodeURIComponent(u);
      }
      function mkFrame(sandbox) {
        view.textContent = '';
        frame = h('iframe', { sandbox: sandbox, title: 'ページ', referrerpolicy: 'no-referrer' });
        view.append(frame);
        return frame;
      }
      function showMsg(title, lines, actions) {
        frame = null; view.textContent = '';
        view.append(h('div', { class: 'hb-page' }, h('h1', null, title), lines.map(l => h('p', null, l)), h('div', { class: 'hb-marks' }, actions || [])));
      }

      async function go(u, push) {
        u = fix(u);
        // DuckDuckGo の検索結果リンクは転送URLなので中身を取り出す
        try { const U = new URL(u); if (/duckduckgo\.com$/.test(U.hostname) && U.pathname === '/l/' && U.searchParams.get('uddg')) u = U.searchParams.get('uddg'); } catch (e) { /* URLでない */ }
        if (push !== false) { hist.splice(hi + 1); hist.push(u); hi = hist.length - 1; }
        cur = u; url.value = u === 'about:home' ? '' : u; lastHtml = null;
        const my = ++seq;
        paint(); status.textContent = '';
        win.setTitle((u === 'about:home' ? 'ホーム' : u.replace(/^https?:\/\//, '')) + ' — hBrowser');
        if (u === 'about:home') return homePage();
        if (u.startsWith('hfs:')) return localPage(u.slice(4));
        const forceProxy = /(^|\.)duckduckgo\.com$/.test(new URL(u).hostname);
        if (!cfg.proxy && !forceProxy) {
          mkFrame('allow-scripts allow-same-origin allow-forms allow-popups').src = u;
          status.textContent = '直接モードで表示中。真っ白のままなら、サイトが埋め込みを拒否しています。「プロキシ」をオンにしてください。';
          return;
        }
        showMsg('読み込み中…', [u]);
        status.textContent = 'プロキシ経由で取得しています…';
        try {
          const r = await OS.net.get(u, { direct: false });
          const type = (r.headers.get('content-type') || '').toLowerCase();
          const buf = await r.arrayBuffer();
          if (my !== seq) return;
          if (/^(image|audio|video)\//.test(type)) {
            const c = await OS.net.blobToContent(new Blob([buf], { type: type }), 'x.bin');
            view.textContent = ''; frame = null;

          h('td', null, w.el.classList.contains('hidden') ? '最小化' : w.zone ? 'スナップ' : '通常'),
          h('td', { class: 'num' },
            h('button', { class: 'btn small', type: 'button', onclick: () => w.focus() }, '前面へ'), ' ',
            h('button', { class: 'btn small danger', type: 'button', title: '保存の確認なしで閉じます', onclick: () => w.close(true) }, '強制終了'))));

<script type="text/x-htmlos" data-path="/sys/htui.js">

    { name: '朝の空', css: 'linear-gradient(160deg,#16324f 0%,#2a628f 45%,#8fb8de 100%)' },
    { name: '夕暮れ', css: 'linear-gradient(160deg,#2b1b3d 0%,#8a3b5c 50%,#f0a868 100%)' },
    { name: '森', css: 'linear-gradient(160deg,#10281f 0%,#2f6b4f 55%,#b7d3a8 100%)' },
    { name: '石', css: 'linear-gradient(160deg,#22252b 0%,#4a505c 60%,#9aa2b1 100%)' },
    { name: '砂', css: 'linear-gradient(160deg,#5a4632 0%,#b08a5b 55%,#ecd9b6 100%)' },

  // ログイン画面（hdm）へ

  // ---------- ポップアップメニュー
  //   items: { label, icon, hint, act } / { sep: true } / { head: '見出し' }
  function buildMenu(items, close) {

    // 時計。fmt(Date) の結果を el に入れ続ける
    clock(el, fmt) { const f = d => { el.textContent = fmt(d); }; ticks.push(f); f(new Date()); return el; },
    pad: n => String(n).padStart(2, '0'),
    // ウィンドウを置く領域。icons=true ならデスクトップアイコンも並べる

  function chime() {
    const sr = 8000, notes = [523.25, 659.25, 783.99, 1046.5], len = 0.2, n = Math.floor(sr * (len * notes.length + 0.5));
    const d = new Uint8Array(44 + n), dv = new DataView(d.buffer);
    const W = (o, s) => { for (let i = 0; i < s.length; i++) d[o + i] = s.charCodeAt(i); };
    W(0, 'RIFF'); dv.setUint32(4, 36 + n, true); W(8, 'WAVEfmt '); dv.setUint32(16, 16, true); dv.setUint16(20, 1, true); dv.setUint16(22, 1, true);
    dv.setUint32(24, sr, true); dv.setUint32(28, sr, true); dv.setUint16(32, 1, true); dv.setUint16(34, 8, true); W(36, 'data'); dv.setUint32(40, n, true);
    for (let i = 0; i < n; i++) {
      const t = i / sr, k = Math.min(notes.length - 1, Math.floor(t / len)), lt = t - k * len;
      d[44 + i] = 128 + Math.round(90 * Math.exp(-lt * 5) * Math.sin(2 * Math.PI * notes[k] * t));
    }
    let b = ''; for (let i = 0; i < d.length; i++) b += String.fromCharCode(d[i]);
    return 'data:audio/wav;base64,' + btoa(b);
  }

  // ---------- 権限つきファイルシステム
  //   root      : どこでも読み書きできる
  //   管理者    : 書けるのは自分のホームと /tmp だけ。読むのは /root 以外すべて
  //   一般ユーザー: 書けるのは自分のホームと /tmp だけ。他人のホームと /root は読めない
  OS.fsFor = function (getUser) {
    const me = () => users.get(getUser()) || { name: getUser() };
    const canW = p => { const u = me(); return !!u.root || p.startsWith('/tmp/') || p.startsWith('/home/' + u.name + '/'); };
    const canR = p => { const u = me(); if (u.root) return true; if (p === '/root' || p.startsWith('/root/')) return false; if (u.admin) return true; if (p === '/root' || p.startsWith('/root/')) return false; const m = p.match(/^\/home\/([^/]+)/); return !m || m[1] === u.name; };
    const W = p => { if (!canW(p)) throw new Error(p + ': 許可がありません（root 権限が必要です）'); return p; };
    const R = p => { if (!canR(p)) throw new Error(p + ': 許可がありません'); return p; };
    return {
      stat: p => fs.stat(R(p)), exists: p => canR(p) && fs.exists(p), isDir: p => canR(p) && fs.isDir(p), isFile: p => canR(p) && fs.isFile(p),
      list: p => fs.list(R(p)), read: p => fs.read(R(p)),
      write: (p, c, o) => fs.write(W(p), c, Object.assign({}, o, { owner: getUser() })),
      mkdir: (p, o) => fs.mkdir(W(p), Object.assign({}, o, { owner: getUser() })),
      rm: (p, o) => fs.rm(W(p), o),
      cp: (a, b) => { R(a); W(fs.dest(a, b)); return fs.cp(a, b, { owner: getUser() }); },
      mv: (a, b) => { W(a); W(fs.dest(a, b)); return fs.mv(a, b); },
      usage: fs.usage, kind: fs.kind, mime: fs.mime, dataURL: p => fs.dataURL(R(p)), unique: fs.unique, canWrite: canW
    };
  };

  // ---------- tty (文字端末。tty1 と Terminal アプリの両方で使う)
  class Tty {
    constructor(host) {
      this.out = h('div', { class: 'tty-out' });
      this.promptEl = h('span', { class: 'tty-prompt' });
      this.input = h('input', { class: 'tty-input', spellcheck: 'false', autocomplete: 'off', autocapitalize: 'off', autocorrect: 'off', enterkeyhint: 'send', 'aria-label': 'コマンド入力' });

      this.scr = h('div', { class: 'tty-scr' }, this.out, this.line);

      const KEYS = [['Tab', () => this._tab()], ['↑', () => this._hist(-1)], ['↓', () => this._hist(1)], ['^C', () => this._cancel()], ['^L', () => this.clear()]]

        const b = h('button', { class: 'tty-key', type: 'button', tabindex: '-1' }, k[0]);
        b.addEventListener('pointerdown', e => { e.preventDefault(); if (this.pending) { k[1](); this.input.focus(); } });
        return b;
      }));

    }

      while (this.out.childNodes.length > 4000) this.out.firstChild.remove();
      this.scr.scrollTop = this.scr.scrollHeight;
    }

      opt = opt || {};
